services:
  mongo-keyfile-init:
    image: mongo:7
    networks:
      - nestjs_network
    entrypoint:
      - bash
      - -c
      - |
        test -f /keyfile/mongo-keyfile || (head -c 756 /dev/urandom | base64 > /keyfile/mongo-keyfile)
        chmod 400 /keyfile/mongo-keyfile
        chown 999:999 /keyfile/mongo-keyfile
    volumes:
      - mongo_keyfile:/keyfile

  mongo:
    image: mongo:7
    container_name: nestjs_mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/keyfile/mongo-keyfile"]
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: nestjs_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/data/keyfile:ro
    networks:
      - nestjs_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - nestjs_network
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongo
      - -u
      - mongo
      - -p
      - mongo
      - --authenticationDatabase
      - admin
      - --eval
      - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }"

  mongo_test:
    image: mongo:7
    container_name: nestjs_mongo_test
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018", "--keyFile", "/data/keyfile/mongo-keyfile"]
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: nestjs_db
    ports:
      - "27018:27018"
    volumes:
      - mongo_test_data:/data/db
      - mongo_keyfile:/data/keyfile:ro
    networks:
      - nestjs_network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-test-init:
    image: mongo:7
    depends_on:
      mongo_test:
        condition: service_healthy
    networks:
      - nestjs_network
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongo_test
      - --port
      - "27018"
      - -u
      - mongo
      - -p
      - mongo
      - --authenticationDatabase
      - admin
      - --eval
      - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27018' }] }) }"

volumes:
  mongo_data:
  mongo_test_data:
  mongo_keyfile:

networks:
  nestjs_network:
    driver: bridge
